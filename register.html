<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeetSync | Add User</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="brand">Meet<span>Sync</span></div><p class="sidebar-label">MAIN MENU</p>
    <nav>
      <a href="dashboard.html">⌂ &nbsp;Dashboard</a>
      <a href="meetings.html">▣ &nbsp;My Meetings</a>
      <a href="schedule.html">＋ &nbsp;Schedule Meeting</a>
      <a href="notifications.html">● &nbsp;Notifications</a>
      <a href="reports.html">▤ &nbsp;Reports</a>
      <a class="active" href="register.html" id="adminNav">♙ &nbsp;Add User</a>
    </nav>
  </aside>
  <main class="main-content">
    <header class="topbar"><div><h1>Add New User</h1><p>Create an account for an authorized MeetSync user.</p></div></header>
    <section class="panel form-panel">
      <div class="admin-note">Administrator access only. Users created here cannot add other users.</div>
      <h2>New User Details</h2>
      <form id="registerForm">
        <div class="form-group"><label for="fullName">Full Name</label><input id="fullName" required placeholder="Enter full name"></div>
        <div class="form-group"><label for="newEmail">Email Address</label><input id="newEmail" type="email" required placeholder="Enter email address"></div>
        <div class="form-group"><label for="newPassword">Password</label><input id="newPassword" type="password" minlength="6" required placeholder="Create a password"></div>
        <div class="form-group"><label for="confirmPassword">Confirm Password</label><input id="confirmPassword" type="password" required placeholder="Confirm password"></div>
        <p id="registerMessage" class="message"></p>
        <button class="btn btn-primary" type="submit">Create User Account</button>
      </form>
    </section>
  </main>
</div>
<script src="js/app.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
